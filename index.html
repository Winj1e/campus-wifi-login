<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>校园网一键登录</title>
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="校园网">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%232563eb'/%3E%3Cg%20fill='none'%20stroke='white'%20stroke-width='4.5'%20stroke-linecap='round'%3E%3Cpath%20d='M11%2027a31%2031%200%200%201%2042%200'/%3E%3Cpath%20d='M19.5%2037a19.5%2019.5%200%200%201%2025%200'/%3E%3Cpath%20d='M27.5%2046.5a9.5%209.5%200%200%201%209%200'/%3E%3C/g%3E%3Ccircle%20cx='32'%20cy='55'%20r='3.2'%20fill='white'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%232563eb'/%3E%3Cg%20fill='none'%20stroke='white'%20stroke-width='4.5'%20stroke-linecap='round'%3E%3Cpath%20d='M11%2027a31%2031%200%200%201%2042%200'/%3E%3Cpath%20d='M19.5%2037a19.5%2019.5%200%200%201%2025%200'/%3E%3Cpath%20d='M27.5%2046.5a9.5%209.5%200%200%201%209%200'/%3E%3C/g%3E%3Ccircle%20cx='32'%20cy='55'%20r='3.2'%20fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f1f3f7; --card:#ffffff; --text:#111827; --sub:#6b7280; --line:#e5e7eb;
  --brand:#2563eb; --ok:#16a34a; --danger:#dc2626; --warn:#d97706; --soft:#f3f4f6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1116; --card:#171b21; --text:#e8eaed; --sub:#9aa3af; --line:#282e37;
    --brand:#3b82f6; --ok:#22c55e; --danger:#ef4444; --warn:#f59e0b; --soft:#21262e;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding:calc(env(safe-area-inset-top) + 18px) 0 40px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}

.hero{text-align:center;padding:14px 0 22px}
.logo{width:66px;height:66px;margin:0 auto 14px;border-radius:17px;background:var(--brand);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(37,99,235,.28)}
.logo svg{width:40px;height:40px}
h1{margin:0 0 6px;font-size:21px;font-weight:650;letter-spacing:.3px}
.status{margin:0;color:var(--sub);font-size:13.5px;min-height:20px;word-break:break-all}
.school{display:inline-block;font-size:12px;color:var(--brand);background:rgba(37,99,235,.1);
  padding:3px 10px;border-radius:20px;margin-bottom:8px;font-weight:500}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}

.btn{display:block;width:100%;border:0;border-radius:14px;font-size:16px;font-weight:600;
  padding:15px 18px;cursor:pointer;font-family:inherit;transition:transform .06s,opacity .2s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.25)}
.btn-primary:disabled{opacity:.45;box-shadow:none}
.btn-ghost{background:transparent;color:var(--sub);font-weight:500;font-size:14.5px;padding:12px;margin-top:4px}
.btn-line{background:var(--soft);color:var(--text);font-weight:500;font-size:14.5px;padding:13px}

.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
label{display:block;font-size:13px;color:var(--sub);margin-bottom:7px;font-weight:500}
label .req{color:var(--danger)}
input[type=text],input[type=password],input[type=url],select,textarea{
  width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);
  border-radius:11px;padding:12px 13px;font-size:15px;font-family:inherit;outline:none;
  transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
textarea{resize:vertical;min-height:70px;line-height:1.5;font-size:13px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
  background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}

.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0}
.switch span{font-size:14.5px}
.toggle{position:relative;width:48px;height:28px;flex:0 0 48px}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;background:var(--line);border-radius:28px;cursor:pointer;transition:.2s}
.slider:before{content:"";position:absolute;width:23px;height:23px;left:2.5px;top:2.5px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle input:checked + .slider{background:var(--brand)}
.toggle input:checked + .slider:before{transform:translateX(20px)}

#result{display:none;border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:14px;line-height:1.6}
#result.on{display:block}
#result.ok{background:rgba(22,163,74,.12);border:1px solid rgba(22,163,74,.3);color:var(--ok)}
#result.err{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.3);color:var(--danger)}
#result.warn{background:rgba(217,119,6,.12);border:1px solid rgba(217,119,6,.32);color:var(--warn)}
#result .code{font-size:11.5px;opacity:.75;margin-top:5px;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace}

#autoBar{display:none;margin-bottom:14px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;text-align:center}
#autoBar.on{display:block}
#autoBar .t{font-size:14px;margin-bottom:4px}
#autoBar .n{font-size:26px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}

.tip{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--sub);line-height:1.6;margin-top:14px}
.tip b{color:var(--text);font-weight:600}
.tip code{background:rgba(125,125,125,.18);padding:1px 5px;border-radius:4px;font-size:11.5px;word-break:break-all}

details{margin-top:14px}
summary{cursor:pointer;font-size:13.5px;color:var(--brand);font-weight:500;padding:6px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸ ";display:inline-block;transition:.15s}
details[open] summary:before{transform:rotate(90deg)}
details .body{font-size:12.5px;color:var(--sub);line-height:1.75;padding:8px 0 2px}
details .body ol{padding-left:18px;margin:6px 0}
details .body li{margin:4px 0}

.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:rgba(20,20,22,.92);
  color:#fff;padding:11px 18px;border-radius:11px;font-size:14px;opacity:0;pointer-events:none;
  transition:.25s;z-index:50;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.mini{font-size:12px;color:var(--sub);text-align:center;margin-top:16px;line-height:1.6}
.mini a{color:var(--brand);text-decoration:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ 主视图 ============ -->
  <div id="viewMain">
    <div class="hero">
      <div class="logo">
        <svg viewBox="0 0 64 64" fill="none">
          <g stroke="#fff" stroke-width="4.5" stroke-linecap="round">
            <path d="M11 27a31 31 0 0 1 42 0"/><path d="M19.5 37a19.5 19.5 0 0 1 25 0"/><path d="M27.5 46.5a9.5 9.5 0 0 1 9 0"/>
          </g>
          <circle cx="32" cy="55" r="3.2" fill="#fff"/>
        </svg>
      </div>
      <h1>校园网一键登录</h1>
      <div class="school" id="schoolTag">华东交通大学 · Dr.COM</div>
      <p class="status" id="statusText">正在读取配置…</p>
    </div>

    <div id="result"></div>

    <div id="autoBar">
      <div class="t">即将自动登录</div>
      <div class="n" id="cdNum">2</div>
      <button class="btn btn-line" style="margin-top:6px" onclick="cancelAuto()">取消</button>
    </div>

    <button class="btn btn-primary" id="btnLogin" onclick="doLogin()">立即登录</button>
    <button class="btn btn-ghost" onclick="showCfg()">修改配置</button>

    <div class="tip" id="tipBox"></div>
  </div>

  <!-- ============ 配置视图 ============ -->
  <div id="viewCfg" hidden>
    <div class="hero" style="padding-bottom:18px">
      <h1 style="font-size:19px">配置登录信息</h1>
      <p class="status">只填一次，之后点图标即可登录</p>
    </div>

    <div class="card">
      <div class="field">
        <label>学号 / 账号 <span class="req">*</span></label>
        <input type="text" id="f_user" placeholder="20230000" autocomplete="off" inputmode="numeric">
      </div>
      <div class="field">
        <label>密码 <span class="req">*</span></label>
        <input type="password" id="f_pass" placeholder="校园网密码" autocomplete="off">
      </div>
      <div class="field">
        <label>账号后缀（一般留空）</label>
        <input type="text" id="f_suffix" placeholder="如 @cmcc / @telecom / @unicom" autocomplete="off">
        <div class="hint">只有在校园网要求选择运营商时才填。多数情况留空即可。</div>
      </div>
    </div>

    <div class="card">
      <div class="switch">
        <span>打开页面自动登录</span>
        <label class="toggle"><input type="checkbox" id="f_auto" checked><span class="slider"></span></label>
      </div>
      <div class="hint" style="margin-top:2px">开启后，点开图标即自动登录，连按钮都不用按。</div>
    </div>

    <button class="btn btn-primary" onclick="saveCfg()">保存并使用</button>
    <button class="btn btn-ghost" id="btnBack" onclick="backToMain()">返回</button>

    <details>
      <summary>高级设置（认证地址已内置，一般不用改）</summary>
      <div class="body">
        <div class="field" style="margin-top:10px">
          <label>登录接口地址</label>
          <input type="url" id="f_loginUrl" autocomplete="off">
        </div>
        <div class="field">
          <label>在线检测接口地址</label>
          <input type="url" id="f_checkUrl" autocomplete="off">
        </div>
        <div class="row">
          <div class="field">
            <label>账号字段名</label>
            <input type="text" id="f_userField" autocomplete="off">
          </div>
          <div class="field">
            <label>密码字段名</label>
            <input type="text" id="f_passField" autocomplete="off">
          </div>
        </div>
        <div class="field">
          <label>附加字段（每行一个）</label>
          <textarea id="f_extra"></textarea>
        </div>
        <button class="btn btn-line" style="margin-top:4px" onclick="resetAdv()">恢复默认值</button>
      </div>
    </details>

    <div class="tip" style="margin-top:16px">
      <b>这个页面怎么来的？</b><br>
      已按华东交通大学 Dr.COM 认证（172.16.2.100:801）预置好全部参数，
      包括登录接口、字段名和固定校验值，所以你只需要填学号和密码。<br>
      认证请求直接发往校园网服务器，<b>不经过任何第三方</b>。
    </div>

    <p class="mini">
      学号和密码只存在<strong>你手机浏览器本地</strong>，不上传任何服务器。<br>
      <a href="javascript:clearAll()">清除全部本地数据</a>
    </p>
  </div>

</div>

<form id="postForm" method="POST" style="display:none"></form>
<div class="toast" id="toast"></div>

<script>
/* ================= 预置配置（华东交通大学 Dr.COM 城市热点） ================= */
var DEF = {
  loginUrl:  'http://172.16.2.100:801/eportal/?c=ACSetting&a=Login',
  checkUrl:  'http://172.16.2.100:801/eportal/?c=ACSetting&a=checkScanIP',
  userField: 'DDDDD',
  passField: 'upass',
  extra:     '0MKKey=123456\nR1=0\nR2=\nR6=1\npara=00'
};

/* 服务器返回码 → 中文说明 */
var RETCODE = {
  '1':                 '登录成功',
  'userid error1':     '学号不存在，请检查是否输错',
  'userid error2':     '学号格式错误',
  'userid error3':     '该学号已被禁用，请联系网络中心',
  'password error':    '密码错误',
  'pasword error':     '密码错误',
  'user is offline':   '账号已离线',
  'account is locked': '账号被锁定，请稍后再试或联系网络中心',
  'not enough money':  '账号余额不足，请充值',
  'time is up':        '账号已到期',
  'mac error':         'MAC 地址校验失败，请关闭随机 MAC 后重试',
  'ip error':          'IP 地址异常，请断开 WiFi 重连',
  'non supported':     '当前网络不支持此认证方式',
  'limit':             '在线设备数已达上限',
  'auth fail':         '认证失败'
};

var KEY = 'ecjtu_wifi_v1';
var cfg = {};
var busy = false;

function $(id){ return document.getElementById(id); }
function enc(s){ return encodeURIComponent(s == null ? '' : s); }

function loadCfg(){
  var c = {};
  try { c = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ c = {}; }
  // 与默认值合并，新增字段自动补全
  for(var k in DEF){ if(!(k in c)) c[k] = DEF[k]; }
  return c;
}
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(cfg)); }
  catch(e){ toast('本地存储不可用，配置无法保存'); }
}

function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.classList.remove('on'); }, 2200);
}

function setStatus(html){ $('statusText').innerHTML = html; }

function showResult(kind, title, code){
  var r = $('result');
  r.className = 'on ' + kind;
  r.innerHTML = '<div>' + title + '</div>' + (code ? '<div class="code">' + code + '</div>' : '');
}
function clearResult(){ $('result').className = ''; $('result').innerHTML = ''; }

/* ---------- 视图切换 ---------- */
function showMain(){
  $('viewCfg').hidden = true;
  $('viewMain').hidden = false;
  refreshMain();
}
function showCfg(){
  fillCfg();
  $('viewMain').hidden = true;
  $('viewCfg').hidden = false;
  window.scrollTo(0,0);
}
function backToMain(){
  if(!cfg.user){ toast('请先填好学号和密码'); return; }
  showMain();
}

function fillCfg(){
  $('f_user').value      = cfg.user || '';
  $('f_pass').value      = cfg.pass || '';
  $('f_suffix').value    = cfg.suffix || '';
  $('f_auto').checked    = cfg.auto !== false;
  $('f_loginUrl').value  = cfg.loginUrl;
  $('f_checkUrl').value  = cfg.checkUrl;
  $('f_userField').value = cfg.userField;
  $('f_passField').value = cfg.passField;
  $('f_extra').value     = cfg.extra;
  $('btnBack').textContent = cfg.user ? '返回' : '稍后再填';
}
function resetAdv(){
  cfg.loginUrl = DEF.loginUrl; cfg.checkUrl = DEF.checkUrl;
  cfg.userField = DEF.userField; cfg.passField = DEF.passField; cfg.extra = DEF.extra;
  fillCfg();
  toast('已恢复默认参数');
}

function saveCfg(){
  var user = $('f_user').value.trim();
  var pass = $('f_pass').value;
  if(!user){ toast('学号不能为空'); $('f_user').focus(); return; }
  if(!pass && pass !== ''){ /* 允许空密码 */ }

  cfg.user      = user;
  cfg.pass      = pass;
  cfg.suffix    = $('f_suffix').value.trim();
  cfg.auto      = $('f_auto').checked;
  cfg.loginUrl  = ($('f_loginUrl').value.trim()  || DEF.loginUrl);
  cfg.checkUrl  = ($('f_checkUrl').value.trim()  || DEF.checkUrl);
  cfg.userField = ($('f_userField').value.trim() || DEF.userField);
  cfg.passField = ($('f_passField').value.trim() || DEF.passField);
  cfg.extra     = $('f_extra').value;
  persist();

  clearResult();
  toast('已保存到本机');
  showMain();
}

/* ---------- 构造请求体 ---------- */
function buildBody(){
  var pairs = [];
  pairs.push(enc(cfg.userField) + '=' + enc((cfg.user || '') + (cfg.suffix || '')));
  pairs.push(enc(cfg.passField) + '=' + enc(cfg.pass || ''));
  (cfg.extra || '').split('\n').forEach(function(line){
    var i = line.indexOf('=');
    if(i > 0) pairs.push(enc(line.slice(0, i).trim()) + '=' + enc(line.slice(i + 1).trim()));
  });
  return pairs.join('&');
}

/* ---------- 在线检测 ---------- */
function checkOnline(){
  return fetch(cfg.checkUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: '',
    cache: 'no-store'
  }).then(function(r){ return r.json(); })
    .then(function(j){ return !!(j && j.result === 'ok'); })
    .catch(function(){ return false; });   // 检测不到就当作未登录，继续尝试
}

/* ---------- 登录 ---------- */
function doLogin(){
  if(busy) return;
  if(!cfg.user){ showCfg(); return; }
  cancelAuto();
  busy = true;
  clearResult();
  var btn = $('btnLogin');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>正在登录…';
  setStatus('正在检测当前网络状态…');

  checkOnline().then(function(online){
    if(online){
      busy = false; btn.disabled = false; btn.textContent = '立即登录';
      setStatus('当前已在线');
      showResult('ok', '已经在线了，无需重复登录。');
      markLogin();
      return;
    }
    setStatus('正在提交登录请求…');
    return submitLogin().then(function(info){
      if(info.fellBack) return;            // 已跳转学校结果页
      if(info.netFail){
        busy = false; btn.disabled = false; btn.textContent = '立即登录';
        setStatus('没能连上认证服务器');
        showResult('err',
          '<b>连不上校园网认证服务器</b><br>请确认已连上校园网 WiFi（而不是别的网络），再重试。',
          cfg.loginUrl);
        return;
      }
      setStatus('正在确认登录结果…');
      return wait(1200).then(checkOnline).then(function(ok){
        busy = false; btn.disabled = false; btn.textContent = '立即登录';
        if(ok){
          markLogin();
          setStatus('登录成功');
          showResult('ok', '<b>登录成功</b>，可以上网了。');
        } else {
          var msg = info.retMsg || '未知原因';
          setStatus('登录失败');
          showResult('err', '<b>登录失败</b>：' + msg + '<br>请检查学号和密码是否正确。',
                     info.retCode ? 'RetCode = ' + info.retCode : '');
        }
      });
    });
  }).catch(function(e){
    busy = false; btn.disabled = false; btn.textContent = '立即登录';
    setStatus('出错了');
    showResult('err', '登录过程出现异常：' + (e && e.message ? e.message : e));
  });
}

function markLogin(){
  cfg.lastLogin = Date.now();
  persist();
}

function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

/* 优先用 fetch 静默提交；失败则退回表单提交（跳转到学校结果页） */
function submitLogin(){
  var body = buildBody();
  return fetch(cfg.loginUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body,
    redirect: 'follow',
    cache: 'no-store'
  }).then(function(r){
    var u = r.url || '';
    var ret = parseRet(u);
    return { url: u, retCode: ret.code, retMsg: ret.msg, netFail: false };
  }).catch(function(){
    // fetch 走不通（跨域 / 混合内容 / 网络不可达）→ 用表单提交，让浏览器自己跳结果页
    formSubmit(body);
    return { fellBack: true };
  });
}

function parseRet(u){
  var m = /[?&]RetCode=([^&]*)/i.exec(u || '');
  if(!m) return { code: '', msg: '' };
  var code = decodeURIComponent(m[1].replace(/\+/g, ' '));
  return { code: code, msg: RETCODE[code] || ('服务器返回：' + code) };
}

function formSubmit(body){
  var f = $('postForm');
  f.innerHTML = '';
  f.method = 'POST';
  f.action = cfg.loginUrl;
  body.split('&').forEach(function(p){
    var i = p.indexOf('=');
    if(i < 0) return;
    var inp = document.createElement('input');
    inp.type = 'hidden';
    inp.name = decodeURIComponent(p.slice(0, i));
    inp.value = decodeURIComponent(p.slice(i + 1).replace(/\+/g, ' '));
    f.appendChild(inp);
  });
  try { sessionStorage.setItem('cw_submit_at', String(Date.now())); } catch(e){}
  cfg.lastLogin = Date.now();
  persist();
  setStatus('正在跳转到认证结果页…');
  f.submit();
}

/* ---------- 自动登录倒计时 ---------- */
var timer = null, left = 2;
function startAuto(){
  var last = null;
  try { last = sessionStorage.getItem('cw_submit_at'); } catch(e){}
  if(last && Date.now() - Number(last) < 30000) return;  // 刚提交过，回来时别再自动跑
  left = 2;
  $('cdNum').textContent = left;
  $('autoBar').classList.add('on');
  clearInterval(timer);
  timer = setInterval(function(){
    left--;
    if(left <= 0){ cancelAuto(); doLogin(); return; }
    $('cdNum').textContent = left;
  }, 1000);
}
function cancelAuto(){
  clearInterval(timer);
  $('autoBar').classList.remove('on');
}

/* ---------- 主视图状态 ---------- */
function refreshMain(){
  if(!cfg.user){
    setStatus('还没配置，先填一次学号密码');
    $('btnLogin').textContent = '开始配置';
    $('tipBox').innerHTML = '<b>首次使用：</b>填好学号密码保存 → 在浏览器菜单里选「添加到主屏幕」'
      + ' → 以后连上校园网点一下图标就自动登录。';
    return;
  }
  $('btnLogin').textContent = '立即登录';
  setStatus('账号 ' + esc(cfg.user + (cfg.suffix || '')));
  var tip = '<b>小提示：</b>在浏览器菜单里选「添加到主屏幕」，之后点桌面图标就能直接登录';
  if(cfg.lastLogin){
    var d = new Date(cfg.lastLogin);
    tip += '（上次登录：' + (d.getMonth() + 1) + '月' + d.getDate() + '日 '
        + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + '）';
  }
  tip += '。';
  $('tipBox').innerHTML = tip;
  if(cfg.auto !== false) startAuto();
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];
  });
}

function clearAll(){
  if(!confirm('清除本机的学号、密码和全部配置？')) return;
  localStorage.removeItem(KEY);
  try { sessionStorage.removeItem('cw_submit_at'); } catch(e){}
  cfg = loadCfg();
  fillCfg();
  clearResult();
  showMain();
  toast('已清除');
}

/* ---------- 启动 ---------- */
cfg = loadCfg();
showMain();
</script>
